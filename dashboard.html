<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>linux-stable cve ledger</title>
<style>
  :root {
    --paper:#E6E7E0; --panel:#F3F3EE; --ink:#12181A; --dim:#5A6663;
    --rule:#C7CAC0; --sel:#223F5C;
    --sev-none:#98A09C; --sev-low:#5D7F5F; --sev-med:#A2751B;
    --sev-high:#9E4529; --sev-crit:#57324F;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, "DejaVu Sans Mono", monospace;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--mono); font-size:13px; line-height:1.45;
  }
  a { color:var(--sel); text-underline-offset:2px; }
  :focus-visible { outline:2px solid var(--sel); outline-offset:2px; }

  .masthead {
    display:flex; flex-wrap:wrap; gap:12px; align-items:baseline;
    justify-content:space-between;
    padding:18px 22px 14px; border-bottom:1px solid var(--ink);
  }
  .wordmark { font-size:17px; letter-spacing:-0.02em; font-weight:600; }
  .wordmark i { font-style:normal; color:var(--dim); padding:0 6px; }
  .masthead .meta { color:var(--dim); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; }

  .notice {
    padding:8px 22px; background:var(--sev-med); color:#FFF8EA;
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  }

  .trains { padding:6px 22px 0; }
  .branch { padding:20px 0 6px; border-bottom:1px solid var(--rule); }
  .branch-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:14px; margin-bottom:14px; }
  .branch-head h2 { margin:0; font-size:22px; letter-spacing:-0.03em; font-weight:600; }
  .branch-head .stat { color:var(--dim); font-size:12px; }
  .branch-head .stat b { color:var(--ink); font-weight:600; }
  .branch-head .stat button {
    font:inherit; color:var(--dim); background:none; border:0; padding:0;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .branch-head .stat button:hover { color:var(--ink); }
  .branch-head .stat button[aria-pressed="true"] { color:var(--ink); font-weight:600; }

  .train {
    display:flex; align-items:flex-end; gap:7px;
    overflow-x:auto; padding-bottom:2px; scrollbar-width:thin;
  }
  .col { flex:0 0 auto; width:30px; border:0; padding:0; background:none; cursor:pointer;
         font-family:var(--mono); color:inherit; text-align:center; }
  .col .n { font-size:10px; color:var(--dim); margin-bottom:4px; }
  .col .stack { display:flex; flex-direction:column-reverse; gap:1px; align-items:stretch; }
  .col .tick { font-size:11px; color:var(--dim); padding-top:5px; border-top:1px solid var(--ink); margin-top:3px; }
  .col[aria-pressed="true"] .tick { color:var(--ink); font-weight:600; }
  .col[aria-pressed="true"] .n { color:var(--ink); font-weight:600; }
  .col:hover .n { color:var(--ink); }
  .cell { display:block; height:4px; cursor:pointer; }
  .cell.on { outline:1.5px solid var(--sel); outline-offset:1px; position:relative; z-index:2; }
  .s0{background:var(--sev-none)} .s1{background:var(--sev-low)} .s2{background:var(--sev-med)}
  .s3{background:var(--sev-high)} .s4{background:var(--sev-crit)}

  .controls {
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:14px 22px; border-bottom:1px solid var(--rule);
  }
  input, select, button.act {
    font-family:var(--mono); font-size:12px; color:var(--ink);
    background:var(--panel); border:1px solid var(--rule); border-radius:0;
    padding:6px 8px;
  }
  input { min-width:200px; flex:1 1 200px; }
  button.act { cursor:pointer; }
  button.act:hover { border-color:var(--ink); }
  .chip {
    font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--dim); margin-left:auto; white-space:nowrap;
  }

  .split { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); }
  .gridwrap { max-height:62vh; overflow:auto; border-right:1px solid var(--rule); }
  table { width:100%; border-collapse:collapse; }
  th {
    position:sticky; top:0; background:var(--paper); z-index:1; text-align:left;
    font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--dim);
    font-weight:500; padding:9px 10px; border-bottom:1px solid var(--ink); cursor:pointer;
    white-space:nowrap;
  }
  th:hover { color:var(--ink); }
  td { padding:6px 10px; border-bottom:1px solid var(--rule); vertical-align:top;
       white-space:nowrap; }
  tr.row { cursor:pointer; }
  tr.row:hover td { background:var(--panel); }
  tr.row[aria-selected="true"] td { background:var(--sel); color:var(--paper); }
  tr.row[aria-selected="true"] .dot { outline:1px solid var(--paper); }
  td.t { font-family:var(--sans); font-size:12px; color:var(--dim); white-space:normal; }
  tr.row[aria-selected="true"] td.t { color:var(--paper); }
  .dot { display:inline-block; width:9px; height:9px; margin-right:6px; vertical-align:-1px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }

  .detail { padding:16px 20px 40px; max-height:62vh; overflow:auto; }
  .detail h3 { margin:0 0 2px; font-size:16px; letter-spacing:-0.02em; }
  .detail .sub { font-family:var(--sans); font-size:13px; color:var(--dim); margin-bottom:14px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .badge {
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    padding:3px 7px; border:1px solid var(--rule); color:var(--dim);
  }
  .badge.hot { background:var(--sev-crit); border-color:var(--sev-crit); color:#F3EAF0; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0 0 14px; }
  dt { font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--dim); padding-top:2px; }
  dd { margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }
  .prose { font-family:var(--sans); font-size:13px; line-height:1.55; margin-bottom:14px; }
  .links { display:flex; flex-wrap:wrap; gap:14px; padding-top:12px; border-top:1px solid var(--rule); }
  .empty { color:var(--dim); font-family:var(--sans); padding:30px 4px; }
  .empty code { font-family:var(--mono); background:var(--panel); padding:1px 4px; }

  @media (max-width: 860px) {
    .split { grid-template-columns:1fr; }
    .gridwrap { border-right:0; border-bottom:1px solid var(--rule); max-height:48vh; }
    .detail { max-height:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<header class="masthead">
  <div class="wordmark">linux-stable<i>/</i>cve ledger</div>
  <div class="meta" id="mast-meta"></div>
</header>
<div class="notice" id="notice" hidden></div>

<section class="trains" id="trains"></section>

<section>
  <div class="controls">
    <input id="q" type="search" placeholder="filter: cve id, subsystem, title" aria-label="Filter">
    <select id="sev" aria-label="Severity">
      <option value="">any severity</option>
      <option value="4">critical (9.0+)</option>
      <option value="3">high (7.0-8.9)</option>
      <option value="2">medium (4.0-6.9)</option>
      <option value="1">low (&lt;4.0)</option>
      <option value="0">unscored</option>
    </select>
    <select id="subsys" aria-label="Subsystem"><option value="">any subsystem</option></select>
    <button class="act" id="reset" type="button">Clear filters</button>
    <button class="act" id="csv" type="button">Export CSV</button>
    <span class="chip" id="chip"></span>
  </div>

  <div class="split">
    <div class="gridwrap">
      <table>
        <thead><tr>
          <th data-sort="cve">CVE</th>
          <th data-sort="rel">Fixed in</th>
          <th data-sort="score" class="num">CVSS</th>
          <th data-sort="epss" class="num">EPSS</th>
          <th data-sort="subsys">Subsystem</th>
          <th data-sort="title">Summary</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <aside class="detail" id="detail"></aside>
  </div>
</section>

<script>
const DATA = /*__DATA__*/null;

const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

const SEV = ["unscored", "low", "medium", "high", "critical"];
const bucket = (score) =>
  score == null ? 0 : score >= 9 ? 4 : score >= 7 ? 3 : score >= 4 ? 2 : 1;

const state = { branch: null, release: null, sev: "", subsys: "", q: "", selected: null,
                unfixed: false, sort: "rel", dir: 1 };

let rows = [];   // one row per (cve, branch) pairing that is in scope
let visible = [];

function boot() {
  if (!DATA || !DATA.branches || !DATA.branches.length) return emptyPage();

  $("#mast-meta").textContent =
    `${DATA.branches.map((b) => b + ".y").join(" · ")} — built ${DATA.generated}`;
  if (DATA.sample) {
    const n = $("#notice");
    n.hidden = false;
    n.textContent = "Sample data — fictional CVE ids, for reviewing the interface only.";
  }

  for (const branch of DATA.branches) {
    for (const r of DATA.byBranch[branch].releases) {
      for (const id of r.cves) rows.push(row(id, branch, r.release));
    }
    for (const id of DATA.byBranch[branch].outstanding) rows.push(row(id, branch, null));
  }

  const subs = [...new Set(rows.map((r) => r.subsys))].sort();
  for (const s of subs) $("#subsys").append(new Option(s, s));

  drawTrains();
  wire();
  refresh();
}

function row(id, branch, release) {
  const c = DATA.cves[id] || {};
  return {
    cve: id, branch, rel: release, relSort: release ? relKey(release) : [1e9],
    score: c.score ?? null, epss: c.epss ?? null, subsys: c.subsys || "unknown",
    title: c.title || "", sev: bucket(c.score ?? null), exploited: !!c.exploited,
  };
}

const relKey = (r) => r.split(".").map(Number);

function emptyPage() {
  $("#trains").innerHTML =
    '<div class="empty">No data in this page yet. Build it with ' +
    '<code>./kcve.py build --branches 6.18,7.1</code>, ' +
    'or look at the interface first with <code>./kcve.py demo</code>.</div>';
}

/* ---------- the release train: one cell per CVE, stacked into its release ---------- */

function drawTrains() {
  const host = $("#trains");
  for (const branch of DATA.branches) {
    const info = DATA.byBranch[branch];
    const releases = info.releases;
    const max = Math.max(1, ...releases.map((r) => r.cves.length));
    // 230px of height, shared out over the busiest release. A big stable release
    // carries 800+ CVEs, so the per-cell slice has to be allowed below 1px --
    // and the 1px gap has to come out of the same budget, or it dominates it.
    const unit = 230 / max;
    const gap = unit >= 3 ? 1 : 0;
    const cellH = Math.min(7, Math.max(0.2, unit - gap));
    const total = releases.reduce((a, r) => a + r.cves.length, 0);

    const panel = el("div", "branch");
    const head = el("div", "branch-head");
    head.append(el("h2", null, branch + ".y"));
    const stat = el("div", "stat");
    stat.innerHTML =
      `<b>${total}</b> CVEs fixed across <b>${releases.length}</b> releases` +
      (info.outstanding.length
        ? ` · <button type="button" data-unfixed="${branch}" aria-pressed="false">` +
          `<b>${info.outstanding.length}</b> affecting the branch with no backport recorded` +
          `</button>`
        : "");
    head.append(stat);
    panel.append(head);

    const train = el("div", "train");
    for (const r of releases) {
      const col = el("button", "col");
      col.type = "button";
      col.dataset.release = r.release;
      col.dataset.branch = branch;
      col.setAttribute("aria-pressed", "false");
      col.title = `${r.release} — ${r.cves.length} CVEs`;
      col.append(el("div", "n", String(r.cves.length)));

      const stack = el("div", "stack");
      stack.style.gap = gap + "px";
      const ordered = [...r.cves].sort(
        (a, b) => bucket(DATA.cves[a]?.score) - bucket(DATA.cves[b]?.score));
      for (const id of ordered) {
        const c = DATA.cves[id] || {};
        const cell = el("span", "cell s" + bucket(c.score ?? null));
        cell.style.height = cellH + "px";
        cell.dataset.cve = id;
        cell.title = `${id} — ${c.score ?? "unscored"} — ${c.subsys || ""}`;
        stack.append(cell);
      }
      col.append(stack);
      col.append(el("div", "tick", "." + r.release.split(".")[2]));
      train.append(col);
    }
    panel.append(train);
    host.append(panel);
  }

  $("#trains").addEventListener("click", (e) => {
    const unfixed = e.target.closest("[data-unfixed]");
    if (unfixed) {
      const branch = unfixed.dataset.unfixed;
      const same = state.unfixed && state.branch === branch;
      Object.assign(state, { unfixed: !same, branch: same ? null : branch, release: null });
      return refresh();
    }
    const cell = e.target.closest(".cell");
    const col = e.target.closest(".col");
    if (!col) return;
    const same = state.release === col.dataset.release && state.branch === col.dataset.branch;
    state.branch = same && !cell ? null : col.dataset.branch;
    state.release = same && !cell ? null : col.dataset.release;
    state.unfixed = false;
    if (cell) state.selected = cell.dataset.cve;
    refresh();
    if (cell) document.querySelector('tr[aria-selected="true"]')
      ?.scrollIntoView?.({ block: "center" });
  });
}

/* ---------- filtering, table, detail ---------- */

function wire() {
  $("#q").addEventListener("input", (e) => { state.q = e.target.value.toLowerCase(); refresh(); });
  $("#sev").addEventListener("change", (e) => { state.sev = e.target.value; refresh(); });
  $("#subsys").addEventListener("change", (e) => { state.subsys = e.target.value; refresh(); });
  $("#reset").addEventListener("click", () => {
    Object.assign(state, { branch: null, release: null, sev: "", subsys: "", q: "",
                          unfixed: false });
    $("#q").value = ""; $("#sev").value = ""; $("#subsys").value = "";
    refresh();
  });
  $("#csv").addEventListener("click", exportCsv);
  document.querySelectorAll("th[data-sort]").forEach((th) =>
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      // risk columns are most useful worst-first
      const fresh = state.sort !== key;
      state.dir = fresh ? (key === "score" || key === "epss" ? -1 : 1) : -state.dir;
      state.sort = key;
      refresh();
    }));
  $("#rows").addEventListener("click", (e) => {
    const tr = e.target.closest("tr.row");
    if (tr) { state.selected = tr.dataset.cve; refresh(); }
  });
}

function refresh() {
  visible = rows.filter((r) =>
    (!state.branch || r.branch === state.branch) &&
    (!state.release || r.rel === state.release) &&
    (!state.unfixed || r.rel === null) &&
    (state.sev === "" || String(r.sev) === state.sev) &&
    (!state.subsys || r.subsys === state.subsys) &&
    (!state.q || (r.cve + " " + r.subsys + " " + r.title).toLowerCase().includes(state.q)));

  const k = state.sort;
  visible.sort((a, b) => {
    let x = a[k], y = b[k];
    if (k === "rel") { x = a.relSort; y = b.relSort;
      for (let i = 0; i < 3; i++) {
        if ((x[i] || 0) !== (y[i] || 0)) return ((x[i] || 0) - (y[i] || 0)) * state.dir;
      }
      return a.cve < b.cve ? -state.dir : state.dir;
    }
    if (typeof x === "number" || typeof y === "number") {
      return ((x ?? -1) - (y ?? -1)) * state.dir;
    }
    return String(x).localeCompare(String(y)) * state.dir;
  });

  document.querySelectorAll("[data-unfixed]").forEach((b) =>
    b.setAttribute("aria-pressed",
      String(state.unfixed && b.dataset.unfixed === state.branch)));
  document.querySelectorAll(".col").forEach((c) =>
    c.setAttribute("aria-pressed",
      String(c.dataset.release === state.release && c.dataset.branch === state.branch)));
  document.querySelectorAll(".cell").forEach((c) =>
    c.classList.toggle("on", c.dataset.cve === state.selected));

  $("#chip").textContent =
    `${visible.length} of ${rows.length} match` +
    (state.unfixed ? ` · ${state.branch}.y no backport`
      : state.release ? ` · ${state.release}`
      : state.branch ? ` · ${state.branch}.y` : "");

  drawRows();
  drawDetail();
}

function drawRows() {
  const body = $("#rows");
  body.textContent = "";
  const frag = document.createDocumentFragment();
  for (const r of visible.slice(0, 1200)) {
    const tr = el("tr", "row");
    tr.dataset.cve = r.cve;
    tr.setAttribute("aria-selected", String(r.cve === state.selected));
    const c1 = el("td");
    const dot = el("span", "dot s" + r.sev);
    dot.title = SEV[r.sev];
    c1.append(dot, document.createTextNode(r.cve));
    tr.append(c1);
    tr.append(el("td", null, r.rel || "not backported"));
    tr.append(el("td", "num", r.score == null ? "—" : r.score.toFixed(1)));
    tr.append(el("td", "num", r.epss == null ? "—" : (r.epss * 100).toFixed(1) + "%"));
    tr.append(el("td", null, r.subsys));
    tr.append(el("td", "t", r.title));
    frag.append(tr);
  }
  body.append(frag);
  if (visible.length > 1200) {
    const tr = el("tr");
    const td = el("td", "t", `${visible.length - 1200} more rows — narrow the filter or export CSV`);
    td.colSpan = 6;
    tr.append(td);
    body.append(tr);
  }
}

function drawDetail() {
  const pane = $("#detail");
  pane.textContent = "";
  const id = state.selected;
  if (!id || !DATA.cves[id]) {
    pane.append(el("div", "empty",
      "Pick a release column, a cell in the stack, or a row to inspect a CVE."));
    return;
  }
  const c = DATA.cves[id];

  pane.append(el("h3", null, id));
  pane.append(el("div", "sub", c.title || "(no title)"));

  const badges = el("div", "badges");
  const add = (t, hot) => { const b = el("span", "badge" + (hot ? " hot" : ""), t); badges.append(b); };
  add(SEV[bucket(c.score ?? null)] + (c.score != null ? ` ${c.score}` : ""));
  if (c.exploited) add("known exploited", true);
  if (c.epss != null) add(`epss ${(c.epss * 100).toFixed(1)}%`);
  if (c.nvd_status) add("nvd: " + c.nvd_status);
  if (c.cwe) add(c.cwe);
  pane.append(badges);

  const dl = document.createElement("dl");
  const pair = (label, value) => {
    if (!value) return;
    dl.append(el("dt", null, label));
    dl.append(el("dd", null, value));
  };
  pair("published", c.published);
  pair("subsystem", c.subsys);
  const fixed = Object.entries(c.fixed || {})
    .sort((a, b) => relKey(a[1])[0] - relKey(b[1])[0] || relKey(a[1])[1] - relKey(b[1])[1])
    .map(([, rel]) => rel).join("  ");
  pair("fixed in", fixed || "no stable release recorded");
  if (c.outstanding?.length) pair("no backport", c.outstanding.map((b) => b + ".y").join("  "));
  pair("files", (c.files || []).join("\n"));
  pane.append(dl);

  if (c.desc) pane.append(el("div", "prose", c.desc));

  const links = el("div", "links");
  const link = (label, href) => {
    const a = el("a", null, label);
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    links.append(a);
  };
  link("cve.org", "https://www.cve.org/CVERecord?id=" + id);
  link("nvd", "https://nvd.nist.gov/vuln/detail/" + id);
  link("euvd", "https://euvd.enisa.europa.eu/search?text=" + id);
  link("kernel cna", "https://lore.kernel.org/linux-cve-announce/?q=" + id);
  (c.commits || []).slice(0, 4).forEach((sha) =>
    link("fix " + sha.slice(0, 12), "https://git.kernel.org/stable/c/" + sha));
  pane.append(links);
}

function exportCsv() {
  const head = ["cve", "branch", "fixed_in", "cvss", "epss", "exploited", "subsystem", "title"];
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const body = visible.map((r) => [
    r.cve, r.branch + ".y", r.rel || "", r.score ?? "", r.epss ?? "",
    r.exploited ? "yes" : "no", r.subsys, r.title,
  ].map(esc).join(","));
  const blob = new Blob([head.join(",") + "\n" + body.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kcve.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

boot();
</script>
</body>
</html>
