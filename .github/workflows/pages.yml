name: pages

on:
  schedule:
    # Daily: always rebuilds. EPSS is regenerated every day and CISA KEV moves
    # on its own schedule, so the page needs a refresh even on a quiet tree.
    - cron: "17 6 * * *"
    # Hourly: rebuilds only when vulns.git has actually moved. This is what the
    # ls-remote gate buys - frequent polling for the cost of one 0.2s request.
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages needs these; nothing here writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VULNS_GIT: https://git.kernel.org/pub/scm/linux/security/vulns.git
  DAILY_CRON: "17 6 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          # Override only if the site is on a custom domain.
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          set -uo pipefail
          if [ "$EVENT" != "schedule" ] || [ "$SCHEDULE" = "$DAILY_CRON" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::full rebuild ($EVENT)"; exit 0
          fi

          owner=${GITHUB_REPOSITORY%%/*}; repo=${GITHUB_REPOSITORY##*/}
          site=${PAGES_URL:-https://$owner.github.io/$repo}
          [ "$repo" = "$owner.github.io" ] && site=${PAGES_URL:-https://$owner.github.io}

          # Any failure here (first run, 404, DNS) leaves prev empty and we
          # build: never skip a deploy because a check was inconclusive.
          remote=$(git ls-remote "$VULNS_GIT" HEAD | cut -f1)
          prev=$(curl -sfL --max-time 30 "$site/vulns.sha" || true)

          if [ -n "$remote" ] && [ "$remote" = "$prev" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::vulns.git unchanged at ${remote:0:12}, skipping"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::vulns.git moved: ${prev:-none} -> ${remote:0:12}"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Shallow clone of vulns.git is ~70 MB over the wire, ~480 MB on disk.
      - name: Build the ledger
        run: ./kcve.py build --out _site/index.html

      # The gate reads this back from the live site on the next hourly run.
      # Must not be a dotfile: upload-pages-artifact v4+ excludes hidden files.
      - name: Stamp the source revision
        run: git -C ~/.cache/kcve/vulns rev-parse HEAD > _site/vulns.sha

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
